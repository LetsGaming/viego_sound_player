<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sound Control Panel</title>
    <!-- Bootstrap CSS -->
    <link
      href="{{ url_for('serve_static', filename='bootstrap/css/bootstrap.min.css') }}"
      rel="stylesheet"
    />
    <!-- Custom Styles -->
    <link
      rel="stylesheet"
      href="{{ url_for('serve_static', filename='styles.css') }}"
    />
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="{{ url_for('serve_static', filename='fontawesome/css/all.min.css')}}"
    />
  </head>
  <body>
    <header class="bg-primary text-white text-center py-4">
      <h1 class="display-4 mb-0">Sound Control Panel</h1>
    </header>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-body">
              <form id="play-form">
                <div class="mb-4">
                  <label for="sound" class="form-label">Sound</label>
                  <select name="sound" id="sound" class="form-select">
                    <!-- Sound options will be populated dynamically -->
                  </select>
                  <div id="desc-container" class="mt-2">
                    <p id="desc" class="text-muted"></p>
                  </div>
                </div>
                <div class="mb-4">
                  <label for="volume" class="form-label">Volume</label>
                  <input
                    type="range"
                    id="volume"
                    name="volume"
                    min="0"
                    max="1"
                    step="0.001"
                    value="1"
                    class="form-range"
                  />
                  <span id="volume-value" class="text-muted">1.0</span>
                </div>
                <div class="justify-content-between align-items-center mb-4">
                  <div
                    class="justify-content-between align-items-center d-flex mb-4"
                  >
                    <div class="form-check">
                      <label for="loop">
                        <div class="icon-checkbox" id="loop-icon" />
                      </label>
                    </div>
                  </div>
                  <div class="form-check form-switch">
                    <label for="toggle-sound" class="form-check-label"
                      ><div id="toggle-sound" class="icon-play"></div
                    ></label>
                  </div>
                </div>

                <div class="mb-4">
                  <label for="language" class="form-label">Language</label>
                  <select name="language" id="language" class="form-select">
                    {% for language in languages %}
                    <option value="{{ language }}">
                      {{ language.upper() }}
                    </option>
                    {% endfor %}
                  </select>
                </div>
                <div class="mb-4">
                  <label for="category" class="form-label">Category</label>
                  <select name="category" id="category" class="form-select">
                    {% for category in categories %}
                    <option value="{{ category }}">
                      {{ category.replace('_', ' ').capitalize() }}
                    </option>
                    {% endfor %}
                  </select>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div
      id="toast"
      class="toast position-fixed bottom-0 end-0 p-3"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="toast-body">
        <i class="fas fa-info-circle me-2"></i>
        <span id="toast-message"></span>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="{{ url_for('serve_static', filename='bootstrap/js/bootstrap.bundle.min.js') }}"></script>
    <!-- Custom Scripts -->
    <script src="{{ url_for('serve_static', filename='script.js') }}"></script>
  </body>
</html>
