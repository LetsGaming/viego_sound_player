<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sound Control Panel</title>
    <!-- Bootstrap CSS -->
    <link
      href="{{ url_for('serve_static', filename='bootstrap/css/bootstrap.min.css') }}"
      rel="stylesheet"
    />
    <!-- Custom Styles -->
    <link
      rel="stylesheet"
      href="{{ url_for('serve_static', filename='styles.css') }}"
    />
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="{{ url_for('serve_static', filename='fontawesome/css/all.min.css')}}"
    />
  </head>
  <body>
    <header class="bg-primary text-white text-center py-4">
      <h1 class="display-4 mb-0">Sound Control Panel</h1>
      <div class="form-check form-switch darkmode-toggle-container">
        <input
          class="form-check-input"
          type="checkbox"
          id="darkModeToggle"
          aria-label="Toggle Dark Mode"
        />
        <label class="form-check-label" for="darkModeToggle">Dark Mode</label>
      </div>
    </header>

    <main class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-body">
              <form id="play-form">
                <div class="mb-4">
                  <label for="sound" class="form-label">Sound</label>
                  <select name="sound" id="sound" class="form-select">
                    <!-- Sound options will be populated dynamically -->
                  </select>
                  <div id="desc-container" class="mt-2">
                    <p id="desc"></p>
                  </div>
                </div>
                <div class="mb-4">
                  <label for="language" class="form-label">Language</label>
                  <select name="language" id="language" class="form-select">
                    {% for language in languages %}
                    <option value="{{ language }}">
                      {{ language.upper() }}
                    </option>
                    {% endfor %}
                  </select>
                </div>
                <div class="mb-4">
                  <label for="category" class="form-label">Category</label>
                  <select name="category" id="category" class="form-select">
                    {% for category in categories %}
                    <option value="{{ category }}">
                      {{ category.replace('_', ' ').capitalize() }}
                    </option>
                    {% endfor %}
                  </select>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="fixed-bottom bg-dark text-white pb-3">
      <div
        class="footer-container container d-flex justify-content-between align-items-center"
      >
        <div class="volume-container d-flex">
          <i id="volume-icon"></i>
          <input
            type="range"
            id="volume"
            name="volume"
            min="0"
            max="1"
            step="0.001"
            value="1"
            class="volume-range form-range"
          />
          <span id="volume-value">100%</span>
        </div>
        <div class="controls-container">
          <!-- Repeat Button -->
          <button id="repeat-button" class="btn btn-secondary">
            <i id="repeat-icon"></i>
          </button>
          <!-- Play/Pause Button -->
          <button id="play-button" class="btn btn-primary">
            <i id="play-icon"></i>
          </button>
        </div>

        <!-- Range Slider for Sound Position -->
        <input
          type="range"
          id="sound-progress"
          class="form-range"
          min="0"
          max="100"
          step="0.1"
          disabled
        />
        <div
          class="sound-progress-text-container"
        >
          <p class="sound-progress-text" id="sound-current-progress">0.00</p>
          <p class="sound-progress-text" id="sound-max-length">0.00</p>
        </div>
      </div>
    </footer>

    <div
      id="toast"
      class="toast position-fixed bottom-0 end-0 p-3"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    >
      <div class="toast-body">
        <i class="fas fa-info-circle me-2"></i>
        <span id="toast-message"></span>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="{{ url_for('serve_static', filename='bootstrap/js/bootstrap.bundle.min.js') }}"></script>
    <!-- Custom Scripts -->
    <script src="{{ url_for('serve_static', filename='script.js') }}"></script>
  </body>
</html>
